services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  chroma:
    image: chromadb/chroma:latest
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    ports:
      - "8080:8080"
    environment:
      OLLAMA_HOST: http://ollama:11434
      CHROMA_HOST: http://chroma:8000
    depends_on:
      - ollama
      - chroma

volumes:
  ollama_data:
  chroma_data:
